<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" width="1120" height="350" role="img" aria-labelledby="title description">
  <title id="title">Standalone routing</title>
  <desc id="description">On any supported platform, the Orchestrator assigns work to Planner, Scouter, Implementer, QA, and Reviewer on that same platform.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#203442}
      .heading{font-size:30px;font-weight:700}
      .label{font-size:24px;font-weight:700}
      .detail{font-size:21px}
      .flow{fill:none;stroke:#526675;stroke-width:3}
      .card{fill:white;stroke:#b1c0c8;stroke-width:2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#526675"/>
    </marker>
  </defs>
  <rect width="1120" height="350" rx="24" fill="#f4f6f5"/>
  <text x="40" y="53" class="heading">Standalone</text>
  <rect x="40" y="76" width="1040" height="242" rx="16" fill="#e9f1f7" stroke="#b1c0c8" stroke-width="2"/>
  <text x="64" y="115" class="detail">any supported platform</text>
  <rect x="420" y="104" width="280" height="62" rx="14" class="card"/>
  <text x="560" y="143" class="label" text-anchor="middle">Orchestrator</text>
  <path class="flow" d="M560 166 V204 M152 204 H968"/>
  <path class="flow" marker-end="url(#arrow)" d="M152 204 V224"/>
  <path class="flow" marker-end="url(#arrow)" d="M356 204 V224"/>
  <path class="flow" marker-end="url(#arrow)" d="M560 204 V224"/>
  <path class="flow" marker-end="url(#arrow)" d="M764 204 V224"/>
  <path class="flow" marker-end="url(#arrow)" d="M968 204 V224"/>
  <g text-anchor="middle" class="label">
    <rect x="64" y="224" width="176" height="64" rx="14" class="card"/>
    <text x="152" y="264">Planner</text>
    <rect x="268" y="224" width="176" height="64" rx="14" class="card"/>
    <text x="356" y="264">Scouter</text>
    <rect x="472" y="224" width="176" height="64" rx="14" class="card"/>
    <text x="560" y="264">Implementer</text>
    <rect x="676" y="224" width="176" height="64" rx="14" class="card"/>
    <text x="764" y="264">QA</text>
    <rect x="880" y="224" width="176" height="64" rx="14" class="card"/>
    <text x="968" y="264">Reviewer</text>
  </g>
</svg>
