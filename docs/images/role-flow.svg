<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 680" width="1560" height="680" role="img" aria-labelledby="title description">
  <title id="title">Yunho Harness 작업 흐름</title>
  <desc id="description">CEO가 요청을 설계 깊이(Spike, Bounded, Architectural)와 위험도(작음·저위험, 일반, 중대·고위험)로 판단합니다. 설계 깊이는 실행 전 승인 단계를, 위험도는 실행 후 검증 역할을 정하고, CEO가 결과를 수락하고 커밋합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6b7780"/>
    </marker>
    <marker id="arrow-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9aa4ab"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; fill: #1f2a33; }
      .title { font-size: 30px; font-weight: 800; letter-spacing: -0.4px; }
      .sub { font-size: 16px; fill: #5f6b73; }
      .ph { font-size: 19px; font-weight: 800; }
      .phs { font-size: 14px; fill: #6b7780; }
      .rl { font-size: 17px; font-weight: 800; }
      .rd { font-size: 13.5px; fill: #5f6b73; }
      .chip { font-size: 14px; font-weight: 650; }
      .box-t { font-size: 20px; font-weight: 800; }
      .box-d { font-size: 14px; fill: #5f6b73; }
      .ceo-t { font-size: 22px; font-weight: 800; fill: #ffffff; }
      .ceo-d { font-size: 14.5px; fill: #d7e1e6; }
      .note { font-size: 14.5px; fill: #5f6b73; }
      .flow { fill: none; stroke: #6b7780; stroke-width: 2.5; marker-end: url(#arrow); }
      .step { fill: none; stroke: #9aa4ab; stroke-width: 1.6; marker-end: url(#arrow-s); }
    </style>
  </defs>
  <rect width="1560" height="680" rx="22" fill="#f7f6f2"/>
  <text class="title" x="48" y="62">설계 깊이와 위험도를 따로 판단합니다</text>
  <text class="sub" x="48" y="94">설계 깊이는 실행 전 승인 단계를, 위험도는 실행 후 검증 역할을 정합니다. CEO가 모든 결과를 수락합니다.</text>
  <rect x="40" y="312" width="120" height="80" rx="16" fill="#ffffff" stroke="#dcdfda" stroke-width="1.5"/>
  <text class="box-t" x="100" y="348" text-anchor="middle">요청</text>
  <text class="box-d" x="100" y="372" text-anchor="middle">작업 목표</text>
  <path class="flow" d="M160 352 H192"/>
  <rect x="198" y="260" width="184" height="184" rx="20" fill="#2c4250"/>
  <text class="ceo-t" x="290" y="306" text-anchor="middle">CEO 판단</text>
  <text class="ceo-d" x="290" y="342" text-anchor="middle">설계 깊이 결정</text>
  <text class="ceo-d" x="290" y="366" text-anchor="middle">위험도 결정</text>
  <text class="ceo-d" x="290" y="390" text-anchor="middle">역할 배정 · 승인 요청</text>
  <text class="ceo-d" x="290" y="414" text-anchor="middle">브랜치 선택 확인</text>
  <rect x="198" y="480" width="184" height="64" rx="14" fill="#ffffff" stroke="#9fc4b0" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text class="chip" x="290" y="508" text-anchor="middle">Scouter</text>
  <text class="rd" x="290" y="530" text-anchor="middle">필요할 때 조사·탐색</text>
  <path d="M290 444 V478" stroke="#9fc4b0" stroke-width="1.6" stroke-dasharray="4 4" fill="none"/>
  <path class="flow" d="M382 352 H418"/>
  <rect x="424" y="128" width="440" height="470" rx="20" fill="#ffffff" stroke="#e1e3de" stroke-width="1.5"/>
  <text class="ph" x="446" y="164">① 설계 깊이</text>
  <text class="phs" x="446" y="188">Planner 초안 → 단계마다 사용자 승인</text>
  <rect x="438" y="206" width="412" height="122" rx="14" fill="#fbf1e1"/>
  <text class="rl" x="454" y="236">Spike</text>
  <text class="rd" x="454" y="258">가능한지 먼저 확인 · 구현은 다시 승인</text>
  <rect x="454.0" y="274" width="109.3" height="38" rx="10" fill="#ffffff" stroke="#e3b877" stroke-width="1.5"/>
  <text class="chip" x="508.7" y="298" text-anchor="middle">질문·방법 승인</text>
  <path class="step" d="M566.3 293 H585.3"/>
  <rect x="589.3" y="274" width="109.3" height="38" rx="10" fill="#ffffff" stroke="#e3b877" stroke-width="1.5"/>
  <text class="chip" x="644.0" y="298" text-anchor="middle">탐색</text>
  <path class="step" d="M701.7 293 H720.7"/>
  <rect x="724.7" y="274" width="109.3" height="38" rx="10" fill="#ffffff" stroke="#e3b877" stroke-width="1.5"/>
  <text class="chip" x="779.3" y="298" text-anchor="middle">결과 보고</text>
  <rect x="438" y="340" width="412" height="122" rx="14" fill="#e8f2ec"/>
  <text class="rl" x="454" y="370">Bounded</text>
  <text class="rd" x="454" y="392">범위가 분명한 변경</text>
  <rect x="454.0" y="408" width="177.0" height="38" rx="10" fill="#ffffff" stroke="#8fbea3" stroke-width="1.5"/>
  <text class="chip" x="542.5" y="432" text-anchor="middle">짧은 설계 승인</text>
  <path class="step" d="M634.0 427 H653.0"/>
  <rect x="657.0" y="408" width="177.0" height="38" rx="10" fill="#ffffff" stroke="#8fbea3" stroke-width="1.5"/>
  <text class="chip" x="745.5" y="432" text-anchor="middle">계획 승인 (필요 시)</text>
  <rect x="438" y="474" width="412" height="122" rx="14" fill="#ecebf7"/>
  <text class="rl" x="454" y="504">Architectural</text>
  <text class="rd" x="454" y="526">구조·계약을 바꾸는 변경</text>
  <rect x="454.0" y="542" width="109.3" height="38" rx="10" fill="#ffffff" stroke="#a29ad1" stroke-width="1.5"/>
  <text class="chip" x="508.7" y="566" text-anchor="middle">설계 승인</text>
  <path class="step" d="M566.3 561 H585.3"/>
  <rect x="589.3" y="542" width="109.3" height="38" rx="10" fill="#ffffff" stroke="#a29ad1" stroke-width="1.5"/>
  <text class="chip" x="644.0" y="566" text-anchor="middle">스펙 승인</text>
  <path class="step" d="M701.7 561 H720.7"/>
  <rect x="724.7" y="542" width="109.3" height="38" rx="10" fill="#ffffff" stroke="#a29ad1" stroke-width="1.5"/>
  <text class="chip" x="779.3" y="566" text-anchor="middle">계획 승인</text>
  <path class="flow" d="M864 352 H908"/>
  <rect x="914" y="128" width="400" height="470" rx="20" fill="#ffffff" stroke="#e1e3de" stroke-width="1.5"/>
  <text class="ph" x="936" y="164">② 실행과 검증</text>
  <text class="phs" x="936" y="188">위험도에 따라 검증 역할 추가</text>
  <rect x="928" y="206" width="372" height="122" rx="14" fill="#e8f2ec"/>
  <text class="rl" x="944" y="236">작음 · 저위험</text>
  <text class="rd" x="944" y="258">좁고, 되돌리기 쉬움</text>
  <rect x="944.0" y="274" width="157.0" height="38" rx="10" fill="#ffffff" stroke="#8fbea3" stroke-width="1.5"/>
  <text class="chip" x="1022.5" y="298" text-anchor="middle">Coder 또는 CEO</text>
  <path class="step" d="M1104.0 293 H1123.0"/>
  <rect x="1127.0" y="274" width="157.0" height="38" rx="10" fill="#ffffff" stroke="#8fbea3" stroke-width="1.5"/>
  <text class="chip" x="1205.5" y="298" text-anchor="middle">CEO 집중 확인</text>
  <rect x="928" y="340" width="372" height="122" rx="14" fill="#e6eef7"/>
  <text class="rl" x="944" y="370">일반</text>
  <text class="rd" x="944" y="392">동작이 바뀌는 변경</text>
  <rect x="944.0" y="408" width="157.0" height="38" rx="10" fill="#ffffff" stroke="#8eaed3" stroke-width="1.5"/>
  <text class="chip" x="1022.5" y="432" text-anchor="middle">Coder</text>
  <path class="step" d="M1104.0 427 H1123.0"/>
  <rect x="1127.0" y="408" width="157.0" height="38" rx="10" fill="#ffffff" stroke="#8eaed3" stroke-width="1.5"/>
  <text class="chip" x="1205.5" y="432" text-anchor="middle">QA</text>
  <rect x="928" y="474" width="372" height="122" rx="14" fill="#f9e9e5"/>
  <text class="rl" x="944" y="504">중대 · 고위험</text>
  <text class="rd" x="944" y="526">공유 계약 · 보안 · 데이터 · 배포</text>
  <rect x="944.0" y="542" width="96.0" height="38" rx="10" fill="#ffffff" stroke="#df9a88" stroke-width="1.5"/>
  <text class="chip" x="992.0" y="566" text-anchor="middle">Coder</text>
  <path class="step" d="M1043.0 561 H1062.0"/>
  <rect x="1066.0" y="542" width="96.0" height="38" rx="10" fill="#ffffff" stroke="#df9a88" stroke-width="1.5"/>
  <text class="chip" x="1114.0" y="566" text-anchor="middle">QA</text>
  <path class="step" d="M1165.0 561 H1184.0"/>
  <rect x="1188.0" y="542" width="96.0" height="38" rx="10" fill="#ffffff" stroke="#df9a88" stroke-width="1.5"/>
  <text class="chip" x="1236.0" y="566" text-anchor="middle">Reviewer</text>
  <path class="flow" d="M1314 352 H1348"/>
  <rect x="1354" y="290" width="166" height="124" rx="18" fill="#2c4250"/>
  <text class="ceo-t" x="1437.0" y="336" text-anchor="middle">CEO 수락</text>
  <text class="ceo-d" x="1437.0" y="366" text-anchor="middle">작업마다 커밋</text>
  <text class="ceo-d" x="1437.0" y="390" text-anchor="middle">push는 별도 승인</text>
  <text class="note" x="48" y="632">· 두 기준은 독립적입니다. Architectural이라고 단계마다 QA·Reviewer를 더하지 않고, Bounded라고 위험이 낮다는 뜻은 아닙니다.</text>
  <text class="note" x="48" y="656">· 계획이 있으면 Reviewer는 모든 작업을 수락한 뒤 최종 전체 변경을 한 번 검토합니다.</text>
</svg>
