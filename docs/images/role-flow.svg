<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 650" role="img" aria-labelledby="title description">
  <title id="title">Yunho Harness 역할 흐름</title>
  <desc id="description">작업 요청을 CEO가 조율해 Scouter, Planner, Coder에게 배정합니다. 필요에 따라 QA와 Reviewer를 거쳐 CEO가 결과를 통합합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 Q 5 5 0 9 L 10 5 Z" fill="#687781"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#25323b" flood-opacity=".09"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #25323b; }
      .title { font-size: 34px; font-weight: 750; letter-spacing: -.5px; }
      .subtitle { font-size: 17px; fill: #65737c; }
      .label { font-size: 20px; font-weight: 700; }
      .detail { font-size: 15px; fill: #65737c; }
      .ceo-title { font-size: 24px; font-weight: 750; fill: #ffffff; }
      .ceo-detail { font-size: 16px; fill: #e8eff0; }
      .node { stroke: #d9dedb; stroke-width: 1.5; }
      .connector { fill: none; stroke: #687781; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .optional { fill: none; stroke: #98a2a5; stroke-width: 2; stroke-dasharray: 6 7; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1480" height="650" rx="28" fill="#f8f6f1"/>
  <circle cx="1385" cy="74" r="42" fill="#f0dfc9" opacity=".55"/>
  <circle cx="1335" cy="95" r="15" fill="#b6d0c4" opacity=".65"/>

  <text class="title" x="56" y="62">필요한 역할을 골라, CEO가 결과를 통합합니다</text>
  <text class="subtitle" x="57" y="94">조사·설계·편집은 작업에 맞춰 배정하고, 검증은 변경 위험에 따라 진행합니다.</text>

  <g class="connector">
    <path d="M 207 326 C 230 326 244 326 270 326"/>
    <path d="M 490 326 C 530 326 526 164 560 164"/>
    <path d="M 490 326 C 525 326 526 326 560 326"/>
    <path d="M 490 326 C 530 326 526 488 560 488"/>
    <path d="M 805 164 C 892 164 914 270 1030 270"/>
    <path d="M 805 326 C 888 326 925 310 1030 310"/>
    <path class="optional" d="M 805 460 C 858 405 923 389 1030 345"/>
    <path d="M 805 488 C 825 488 830 488 850 488"/>
    <path d="M 1030 488 C 1044 488 1052 488 1070 488"/>
    <path d="M 1270 488 C 1334 464 1322 395 1245 370"/>
    <path d="M 1250 300 C 1273 300 1292 300 1320 300"/>
  </g>

  <g filter="url(#shadow)">
    <rect class="node" x="57" y="275" width="150" height="102" rx="24" fill="#ffffff"/>
    <circle cx="91" cy="326" r="13" fill="#e6b36d"/>
    <path d="M86 326h10M91 321v10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text class="label" x="113" y="322">요청</text>
    <text class="detail" x="113" y="347">작업 목표</text>

    <rect x="270" y="251" width="220" height="150" rx="27" fill="#314958" stroke="#314958" stroke-width="1.5"/>
    <circle cx="309" cy="299" r="17" fill="#e8b86f"/>
    <path d="M302 299l5 5 10-11" fill="none" stroke="#314958" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="ceo-title" x="338" y="306">CEO 조율</text>
    <text class="ceo-detail" x="295" y="345">범위 · 승인 · 역할 배정</text>
    <text class="ceo-detail" x="295" y="372">통합 · 수락</text>

    <rect class="node" x="560" y="119" width="245" height="90" rx="22" fill="#e9f0ec"/>
    <circle cx="596" cy="164" r="18" fill="#9ec3ae"/>
    <circle cx="594" cy="162" r="8" fill="none" stroke="#fff" stroke-width="2.5"/>
    <path d="M600 168l7 7" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <text class="label" x="627" y="160">Scouter</text>
    <text class="detail" x="627" y="184">읽기 전용 조사</text>

    <rect class="node" x="560" y="281" width="245" height="90" rx="22" fill="#f5eadb"/>
    <circle cx="596" cy="326" r="18" fill="#e4b570"/>
    <path d="M589 332l2-7 11-11 5 5-11 11zM600 315l5 5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
    <text class="label" x="627" y="322">Planner</text>
    <text class="detail" x="627" y="346">설계와 계획</text>

    <rect class="node" x="560" y="443" width="245" height="90" rx="22" fill="#e8edf4"/>
    <circle cx="596" cy="488" r="18" fill="#91a9c4"/>
    <path d="M590 482l-6 6 6 6M602 482l6 6-6 6M599 479l-6 18" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="627" y="484">Coder</text>
    <text class="detail" x="627" y="508">승인된 범위 편집</text>

    <rect class="node" x="850" y="443" width="180" height="90" rx="22" fill="#f7e5dd"/>
    <circle cx="883" cy="488" r="17" fill="#d98d72"/>
    <path d="M875 488l6 6 11-13" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="911" y="484">QA</text>
    <text class="detail" x="911" y="508">필요한 검증</text>

    <rect class="node" x="1070" y="443" width="200" height="90" rx="22" fill="#eee8f4"/>
    <circle cx="1104" cy="488" r="17" fill="#a898bd"/>
    <path d="M1097 482h14v12h-14zM1100 478h8v4h-8zM1100 486h8M1100 490h6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="1132" y="484">Reviewer</text>
    <text class="detail" x="1132" y="508">중요 변경 검토</text>

    <rect class="node" x="1030" y="230" width="220" height="140" rx="26" fill="#ffffff"/>
    <circle cx="1070" cy="277" r="17" fill="#9ec3ae"/>
    <path d="M1063 277l5 5 10-11" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="1098" y="284">CEO 통합</text>
    <text class="detail" x="1056" y="319">결과와 검증 근거를</text>
    <text class="detail" x="1056" y="342">확인해 마무리</text>

    <rect class="node" x="1320" y="250" width="112" height="100" rx="24" fill="#f0dfc9"/>
    <path d="M1353 298l13 13 32-34" fill="none" stroke="#a8783c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="1376" y="337" text-anchor="middle">결과</text>
  </g>

  <text class="detail" x="830" y="401">저위험 · CEO 확인</text>
  <text class="detail" x="58" y="598">저위험 변경은 CEO가 집중 확인할 수 있습니다. QA는 위험도에 따라, Reviewer는 중요 변경에 적용합니다.</text>
</svg>
