<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1100" width="1560" height="1100" role="img" aria-labelledby="title description">
<title id="title">ARC request, preparation, and acceptance flow</title>
<desc id="description">Orchestrator routes requests and optional Scouter findings, then chooses design depth independently of verification risk. Approved documents precede platform preparation and handoff. Ready independent tasks receive fresh Implementers, required checks, Orchestrator acceptance, and plan task commits or no-change records. Significant planned work has final whole-change review after task acceptances; significant unplanned work has review before acceptance.</desc>
<defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#203442} .heading{font-size:30px;font-weight:700} .label{font-size:25px;font-weight:700} .detail{font-size:22px} .note{font-size:21px} .flow{fill:none;stroke:#526675;stroke-width:3} .return{fill:none;stroke:#526675;stroke-width:2;stroke-dasharray:7 5} .card{fill:white;stroke:#b1c0c8;stroke-width:2}</style></defs>
<rect width="1560" height="1100" rx="24" fill="#f4f6f5"/>
<text x="50" y="51" class="heading">Design depth and verification risk are separate</text>
<text x="50" y="87" class="detail">Orchestrator owns routing, approvals, integration, acceptance, and commits.</text>

<rect x="50" y="115" width="230" height="105" rx="14" class="card"/>
<text x="70" y="149" class="label">Request</text>
<text x="70" y="180" class="detail">Goal and constraints</text>
<rect x="340" y="115" width="580" height="105" rx="14" class="card"/>
<text x="360" y="149" class="label">Orchestrator</text>
<text x="360" y="180" class="detail">Simple answers stay here; route scoped work.</text>
<rect x="1000" y="115" width="510" height="105" rx="14" class="card"/>
<text x="1020" y="149" class="label">Scouter (optional)</text>
<text x="1020" y="180" class="detail">Research / static exploration; return findings</text>
<g class="connector"><path class="flow" d="M280 166 H340"/><polygon points="340,166 326,159 326,173" fill="#526675"/></g>
<g class="connector"><path class="flow" d="M920 148 H1000"/><polygon points="1000,148 986,141 986,155" fill="#526675"/></g>
<g class="connector"><path class="return" d="M1000 190 H920"/><polygon points="920,190 934,183 934,197" fill="#526675"/></g>
<text x="50" y="266" class="label">Planner drafts → user approves each applicable stage</text>
<rect x="50" y="285" width="460" height="155" rx="14" class="card"/>
<text x="70" y="319" class="label">Spike</text>
<text x="70" y="350" class="detail">Approve question + method</text>
<text x="70" y="379" class="detail">Explore → report findings</text>
<text x="70" y="408" class="detail">Reassess implementation / documents</text>
<rect x="550" y="285" width="460" height="155" rx="14" class="card"/>
<text x="570" y="319" class="label">Bounded</text>
<text x="570" y="350" class="detail">Approve short design</text>
<text x="570" y="379" class="detail">Spec if required; plan if needed</text>
<text x="570" y="408" class="detail">Omission needs narrow eligibility</text>
<rect x="1050" y="285" width="460" height="155" rx="14" class="card"/>
<text x="1070" y="319" class="label">Architectural</text>
<text x="1070" y="350" class="detail">Approve design direction</text>
<text x="1070" y="379" class="detail">Approve written spec</text>
<text x="1070" y="408" class="detail">Approve implementation plan</text>
<g class="connector"><path class="flow" d="M630 220 V246"/><polygon points="630,246 623,232 637,232" fill="#526675"/></g>
<g class="connector"><path class="flow" d="M280 440 V465 H780"/><polygon points="780,465 766,458 766,472" fill="#526675"/></g>
<g class="connector"><path class="flow" d="M1280 440 V465 H780"/><polygon points="780,465 794,458 794,472" fill="#526675"/></g>
<g class="connector"><path class="flow" d="M780 440 V487"/><polygon points="780,487 773,473 787,473" fill="#526675"/></g>
<rect x="50" y="490" width="1460" height="112" rx="14" class="card" style="fill:#e9f1f7"/>
<text x="70" y="524" class="label">Approved documents → platform preparation → handoff</text>
<text x="70" y="555" class="detail">Complete document set; explicit target choice; verified document commit and actual state.</text>
<text x="70" y="584" class="detail">Codex: managed worktree option. Claude v1: current checkout.</text>
<g class="connector"><path class="flow" d="M780 602 V632"/><polygon points="780,632 773,618 787,618" fill="#526675"/></g>
<rect x="50" y="635" width="1460" height="110" rx="14" class="card"/>
<text x="70" y="669" class="label">Ready independent tasks</text>
<text x="70" y="700" class="detail">Fresh Implementer per top-level task; ownership + inputs + accepted predecessors + capacity.</text>
<text x="70" y="729" class="detail">Reserve slots; obey total/concurrent limits and lower runtime capacity. No same-file concurrent edits.</text>
<g class="connector"><path class="flow" d="M780 745 V775"/><polygon points="780,775 773,761 787,761" fill="#526675"/></g>
<rect x="50" y="778" width="1460" height="111" rx="14" class="card" style="fill:#e9f3ed"/>
<text x="70" y="812" class="label">Required checks → Orchestrator acceptance</text>
<text x="70" y="843" class="detail">Low risk: focused checks. Ordinary / significant: fresh QA and criterion evidence.</text>
<text x="70" y="872" class="detail">Plan task: focused commit; no change: record only</text>
<g class="connector"><path class="flow" d="M780 889 V919"/><polygon points="780,919 773,905 787,905" fill="#526675"/></g>
<rect x="50" y="922" width="1460" height="128" rx="14" class="card"/>
<text x="70" y="956" class="label">Reassess readiness; complete final verification</text>
<text x="70" y="987" class="detail">Significant planned work: final whole-change Reviewer review after all task acceptances.</text>
<text x="70" y="1016" class="detail">Significant unplanned work: Reviewer review before acceptance.</text>
<text x="70" y="1045" class="detail">Failure: hold affected work, inspect, resolve, revalidate</text>
<text x="50" y="1080" class="note">All specialists return to Orchestrator. Role completion alone does not release dependents. Details: harness-operation.md</text>
</svg>
