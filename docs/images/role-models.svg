<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 600" width="1560" height="600" role="img" aria-labelledby="title description">
<title id="title">Role models and platforms</title>
<desc id="description">The Orchestrator uses the current conversation model. In new Claude and Codex composite configurations, Planner and Reviewer default to Claude Code; Scouter, Implementer and QA default to Codex. Any specialist role can move to either platform and has a model and effort selected through Change Models.</desc>
<defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#203442} .heading{font-size:30px;font-weight:700} .label{font-size:25px;font-weight:700} .detail{font-size:22px} .note{font-size:21px} .flow{fill:none;stroke:#526675;stroke-width:3} .card{fill:white;stroke:#b1c0c8;stroke-width:2}</style></defs>
<rect width="1560" height="600" rx="24" fill="#f4f6f5"/>
<text x="50" y="51" class="heading">Role models and platforms</text>
<text x="50" y="87" class="detail">Orchestrator uses the current conversation; each specialist role has a platform, model and effort.</text>

<rect x="50" y="245" width="360" height="130" rx="14" class="card"/>
<text x="75" y="287" class="label">Orchestrator</text>
<text x="75" y="327" class="detail">Current conversation model</text>

<text x="510" y="139" class="note">Default in Claude &amp; Codex; any role can move</text>
<rect x="510" y="160" width="1000" height="145" rx="14" class="card" style="fill:#e9f1f7"/>
<text x="535" y="197" class="label">Claude Code</text>
<rect x="535" y="217" width="460" height="65" rx="12" class="card"/>
<text x="560" y="258" class="label">Planner</text>
<rect x="1020" y="217" width="465" height="65" rx="12" class="card"/>
<text x="1045" y="258" class="label">Reviewer</text>

<rect x="510" y="330" width="1000" height="145" rx="14" class="card" style="fill:#e9f3ed"/>
<text x="535" y="367" class="label">Codex</text>
<rect x="535" y="387" width="300" height="65" rx="12" class="card"/>
<text x="560" y="428" class="label">Scouter</text>
<rect x="860" y="387" width="300" height="65" rx="12" class="card"/>
<text x="885" y="428" class="label">Implementer</text>
<rect x="1185" y="387" width="300" height="65" rx="12" class="card"/>
<text x="1210" y="428" class="label">QA</text>

