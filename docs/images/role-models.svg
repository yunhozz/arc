  <text x="20" y="83" class="note">Scouter</text><text x="142" y="83" class="setting">gemini-2.5-flash / default</text>
  <text x="20" y="119" class="note">Planner</text><text x="142" y="119" class="setting">gemini-2.5-flash / default</text>
  <text x="20" y="155" class="note">Implementer</text><text x="142" y="155" class="setting">gemini-2.5-flash / default</text>
  <text x="20" y="191" class="note">QA</text><text x="142" y="191" class="setting">gemini-2.5-flash / default</text>
