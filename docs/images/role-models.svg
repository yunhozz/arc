<g transform="translate(1160 285)">
  <rect width="350" height="260" rx="14" class="card"/>
  <text x="20" y="41" class="label">Grok</text>
  <text x="20" y="83" class="note">Scouter</text><text x="142" y="83" class="setting">grok-4.6 / default</text>
  <text x="20" y="119" class="note">Planner</text><text x="142" y="119" class="setting">grok-4.6 / default</text>
  <text x="20" y="155" class="note">Implementer</text><text x="142" y="155" class="setting">grok-4.6 / default</text>
  <text x="20" y="191" class="note">QA</text><text x="142" y="191" class="setting">grok-4.6 / default</text>
  <text x="20" y="227" class="note">Reviewer</text><text x="142" y="227" class="setting">grok-4.6 / default</text>
</g>

<rect x="50" y="575" width="1460" height="48" rx="12" class="card"/>
<text x="70" y="606" class="note">Packaged catalog → models.toml (Configure)</text>
</svg>
