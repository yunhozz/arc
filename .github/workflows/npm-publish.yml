name: Publish npm package
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [dry-run, publish-current]
        default: dry-run
        required: true
permissions: {}
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  plan:
    if: (github.event_name == 'workflow_dispatch' && inputs.action == 'dry-run') || vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      bump: ${{ steps.plan.outputs.bump }}
      version: ${{ steps.plan.outputs.version }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Plan release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTION: ${{ inputs.action }}
        run: node .github/scripts/release-plan.mjs plan

  rehearse:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUMP: ${{ needs.plan.outputs.bump }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source manifest
        run: node scripts/update-manifest.mjs --check
      - name: Rehearse version bump
        run: |
          if [ -n "$BUMP" ]; then
            npm version "$BUMP" --no-git-tag-version --ignore-scripts
            node scripts/update-manifest.mjs
            npm run check:manifest
          fi
      - name: Pack and verify rehearsal
        run: |
          REHEARSE_VERSION="${VERSION:-$(node -p 'require("./package.json").version')}"
          [ "$(node -p 'require("./package.json").version')" = "$REHEARSE_VERSION" ] || { echo 'Rehearsal version mismatch.' >&2; exit 1; }
          npm run pack:release -- --out-dir "$RUNNER_TEMP/arc-release"
          node scripts/verify-release.mjs --out-dir "$RUNNER_TEMP/arc-release" --name @yunhozz/arc --version "$REHEARSE_VERSION"

  release:
    needs: plan
    if: vars.NPM_PUBLISH_ENABLED == 'true' && github.event_name == 'push' && needs.plan.outputs.mode == 'bump'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    env:
      BUMP: ${{ needs.plan.outputs.bump }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check master tip
        run: |
          remote_sha=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo 'Master tip changed; refusing release.' >&2
            exit 1
          fi
      - name: Check source manifest
        run: node scripts/update-manifest.mjs --check
      - name: Bump version
        run: npm version "$BUMP" --no-git-tag-version --ignore-scripts
      - name: Update manifest
        run: node scripts/update-manifest.mjs
      - name: Check updated manifest
        run: npm run check:manifest
      - name: Validate release changes and tag availability
        run: |
          changes=$(git status --porcelain)
          expected=$(printf ' M MANIFEST.sha256\n M package-lock.json\n M package.json')
          if [ "$changes" != "$expected" ]; then
            echo 'Unexpected release changes.' >&2
            printf '%s\n' "$changes" >&2
            exit 1
          fi
          [ "$(node -p 'require("./package.json").version')" = "$VERSION" ] || { echo 'Release version mismatch.' >&2; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"; then
            echo 'Release tag already exists.' >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
          fi
      - name: Commit and push release atomically
        id: release
        run: |
          git add package.json package-lock.json MANIFEST.sha256
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:refs/heads/master "refs/tags/v$VERSION"
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  publish:
    needs: [plan, release]
    if: >-
      !cancelled() && vars.NPM_PUBLISH_ENABLED == 'true' && needs.plan.result == 'success' &&
      ((needs.plan.outputs.mode == 'bump' && needs.release.result == 'success') ||
      ((needs.plan.outputs.mode == 'manual' || needs.plan.outputs.mode == 'publish-current') && needs.release.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.mode == 'bump' && needs.release.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install publication npm
        run: npm install --global npm@11
      - name: Recheck published version
        id: published
        run: node .github/scripts/release-plan.mjs published
      - name: Check publication version
        if: steps.published.outputs.published == 'false'
        run: |
          [ "$(node -p 'require("./package.json").version')" = "$VERSION" ] || { echo 'Publication version mismatch.' >&2; exit 1; }
      - name: Check source manifest
        if: steps.published.outputs.published == 'false'
        run: node scripts/update-manifest.mjs --check
      - name: Pack release
        if: steps.published.outputs.published == 'false'
        run: npm run pack:release -- --out-dir "$RUNNER_TEMP/arc-release"
      - name: Verify release
        if: steps.published.outputs.published == 'false'
        run: node scripts/verify-release.mjs --out-dir "$RUNNER_TEMP/arc-release" --name @yunhozz/arc --version "$VERSION"
      - name: Publish release
        if: steps.published.outputs.published == 'false'
        run: npm publish "$RUNNER_TEMP/arc-release/arc-release.tgz" --access public --provenance --registry https://registry.npmjs.org/
