name: Publish npm package
on:
  push:
    branches: [master]
    paths: [package.json, package-lock.json]
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  eligibility:
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check release version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const fail = message => { throw new Error(message); };
          const stable = value => typeof value === 'string' && /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(value);
          const greater = (left, right) => {
            const a = left.split('.').map(BigInt);
            const b = right.split('.').map(BigInt);
            const index = a.findIndex((value, i) => value !== b[i]);
            return index >= 0 && a[index] > b[index];
          };
          const current = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          if (lock.name !== current.name || lock.version !== current.version || lock.packages?.['']?.name !== current.name || lock.packages?.['']?.version !== current.version) fail('package-lock.json must match package.json name and version.');
          if (current.name !== '@yunhozz/arc' || !stable(current.version)) fail('Expected @yunhozz/arc with a stable version.');
          const before = process.env.BEFORE_SHA;
          if (!/^[a-f0-9]{40}$/.test(before) || /^0+$/.test(before)) fail('Missing previous master commit; cannot establish a version change.');
          const previous = JSON.parse(execFileSync('git', ['show', `${before}:package.json`], { encoding: 'utf8' }));
          if (previous.name !== current.name || !stable(previous.version)) fail('Invalid previous package metadata.');
          if (previous.version === current.version) {
            console.log('Version unchanged; skipping publication.');
          } else {
            if (!greater(current.version, previous.version)) fail('New version must be greater than previous master version.');
            const response = await fetch('https://registry.npmjs.org/@yunhozz%2Farc', { signal: AbortSignal.timeout(30000) });
            if (response.status === 404) fail('Publish @yunhozz/arc manually once, then configure npm Trusted Publishing before enabling this workflow.');
            if (!response.ok) fail(`npm registry request failed: ${response.status}`);
            const metadata = await response.json();
            const latest = metadata['dist-tags']?.latest;
            if (metadata.name !== current.name || !stable(latest) || !metadata.versions || typeof metadata.versions !== 'object' || Array.isArray(metadata.versions) || metadata.versions[latest]?.version !== latest) fail('Invalid npm registry metadata.');
            if (Object.hasOwn(metadata.versions, current.version)) {
              if (metadata.versions[current.version]?.version !== current.version) fail('Invalid published version metadata.');
              console.log('Version already published; skipping publication.');
            } else {
              if (!greater(current.version, latest)) fail('New version must be greater than npm latest.');
              appendFileSync(process.env.GITHUB_OUTPUT, 'publish=true\n');
            }
          }
          NODE
  publish:
    needs: eligibility
    if: needs.eligibility.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11
      - run: node scripts/update-manifest.mjs --check
      - run: npm publish --access public --provenance --registry https://registry.npmjs.org/
