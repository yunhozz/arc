name: Native installer prebuilds
on:
  workflow_dispatch:
  pull_request:
    paths:
      - native/**
      - lib/safe-fs/**
      - scripts/build-native.mjs
      - package.json
      - package-lock.json
      - .github/workflows/native-prebuilds.yml
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            tuple: darwin-arm64
          - runner: macos-15-intel
            tuple: darwin-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/build-native.mjs --tuple ${{ matrix.tuple }} --output build/native/${{ matrix.tuple }}
      - run: node --test tests/node/safe-fs.test.mjs tests/node/native-loader.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.tuple }}
          path: build/native/
          if-no-files-found: error
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            tuple: linux-x64-gnu
            image: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            tuple: linux-arm64-gnu
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and execute on glibc 2.28
        shell: bash
        env:
          BUILD_IMAGE: ${{ matrix.image }}
          BUILD_TUPLE: ${{ matrix.tuple }}
        run: |
          docker pull "$BUILD_IMAGE"
          image_digest=$(docker image inspect "$BUILD_IMAGE" --format '{{index .RepoDigests 0}}')
          node_home=$(dirname "$(dirname "$(command -v node)")")
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -v "$node_home:/opt/node:ro" -w /work \
            -e PATH=/opt/node/bin:/opt/python/cp311-cp311/bin:/usr/local/bin:/usr/bin:/bin \
            -e PYTHON=/opt/python/cp311-cp311/bin/python3 -e ARC_BUILD_IMAGE="$image_digest" \
            -e BUILD_TUPLE="$BUILD_TUPLE" "$image_digest" /bin/bash -c \
            'git config --global --add safe.directory /work && npm ci --ignore-scripts && node scripts/build-native.mjs --tuple "$BUILD_TUPLE" --output "build/native/$BUILD_TUPLE" && node --test tests/node/safe-fs.test.mjs tests/node/native-loader.test.mjs'
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.tuple }}
          path: build/native/
          if-no-files-found: error
